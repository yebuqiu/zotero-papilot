<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papilot 引文快取</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="../../icons/icon32.png" alt="" width="22" height="22">
      <div class="brand-text">
        <strong>Papilot 引文</strong>
        <span id="source-badge">正在读取…</span>
      </div>
    </div>
    <button id="btn-settings" class="icon-btn" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M19.4 13.5a7.8 7.8 0 0 0 0-3l1.7-1.3-1.8-3.1-2 .8a7.7 7.7 0 0 0-2.6-1.5L14.4 3h-3.6l-.3 2.4a7.7 7.7 0 0 0-2.6 1.5l-2-.8-1.8 3.1L5.8 10.5a7.8 7.8 0 0 0 0 3l-1.7 1.3 1.8 3.1 2-.8a7.7 7.7 0 0 0 2.6 1.5l.3 2.4h3.6l.3-2.4a7.7 7.7 0 0 0 2.6-1.5l2 .8 1.8-3.1-1.7-1.3Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <section class="source">
    <div id="paper-title" class="paper-title">读取中…</div>
    <div id="paper-meta" class="paper-meta"></div>
  </section>

  <div id="formats" class="formats" role="tablist" aria-label="引文格式"></div>

  <section class="output-wrap">
    <pre id="output" class="output" tabindex="0" aria-live="polite"></pre>
    <div id="error" class="error hidden"></div>
  </section>

  <footer class="foot">
    <button id="btn-copy" class="primary" disabled>复制引文</button>
    <span id="status" class="status"></span>
    <button id="btn-reread" class="link-btn">重新读取</button>
  </footer>

  <div id="toast" class="toast hidden"></div>

  <script src="../vendor/ref-format.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
