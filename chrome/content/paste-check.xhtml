<!DOCTYPE window>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:html="http://www.w3.org/1999/xhtml"
        title="Papilot · 文献列表核验（AI 幻觉检测）"
        windowtype="papilot:dialog"
        width="760" height="600">
  <script src="chrome://papilot/content/paste-check.js"></script>
  <vbox flex="1" style="padding:12px;">
    <label value="粘贴文献列表（每行一条，支持含 DOI / APA / Vancouver 等常见格式），核验每条是否真实存在："/>
    <html:textarea id="pp-pc-input" rows="8"
      style="width:100%;margin:6px 0;font-family:monospace;font-size:12px;"
      placeholder="例：&#10;[1] Vaswani A, et al. Attention is all you need. NeurIPS. 2017.&#10;2. Smith J. Made up paper on quantum bananas. Nature. 2099. doi:10.9999/fake.123"/>
    <hbox style="gap:8px;align-items:center;">
      <html:button id="pp-pc-run" style="font-weight:bold;">开始核验</html:button>
      <html:button id="pp-pc-clear">清空</html:button>
      <html:span id="pp-pc-status" style="color:var(--fill-secondary,#666);"></html:span>
      <spacer flex="1"/>
      <html:button id="pp-pc-close">关闭</html:button>
    </hbox>
    <vbox id="pp-pc-results" flex="1"
      style="overflow-y:auto;border:1px solid var(--fill-tertiary,#999);padding:8px;margin-top:8px;background:var(--material-surface,#fff);color:var(--fill-primary,#222);font-size:13px;"/>
  </vbox>
</window>
