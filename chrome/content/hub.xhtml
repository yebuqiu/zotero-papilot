<!DOCTYPE window>
<!-- Papilot 功能中心（0.12.0）：统一导航入口
     左侧类别页签（一类一页，职责单一），右侧功能卡片 + 搜索过滤；
     windowtype 供单实例枚举；persist 记忆位置/大小 -->
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:html="http://www.w3.org/1999/xhtml"
        title="Papilot 功能中心"
        windowtype="papilot:hub"
        width="820" height="600"
        persist="screenX screenY width height sizemode">
  <script src="chrome://papilot/content/hub.js"/>
  <hbox flex="1" style="min-height:0;">

    <!-- 左侧：类别导航 -->
    <vbox style="width:170px;min-width:170px;border-right:1px solid var(--material-border,1px solid #ccc);background:var(--material-sidepane,#f0f0f2);padding:8px 6px;gap:2px;">
      <html:div style="font-weight:700;font-size:14px;padding:4px 8px 10px;">Papilot</html:div>
      <vbox id="pp-hub-nav" flex="1" style="gap:2px;"/>
      <html:div id="pp-hub-selcount" style="color:var(--fill-secondary,#777);font-size:11px;padding:8px 8px 2px;border-top:1px solid var(--material-border,1px solid #ddd);"></html:div>
    </vbox>

    <!-- 右侧：类别页 -->
    <vbox flex="1" style="padding:12px;gap:8px;min-width:0;">
      <hbox style="align-items:flex-end;gap:10px;">
        <vbox flex="1" style="min-width:0;">
          <html:div id="pp-hub-cat-title" style="font-weight:700;font-size:16px;"></html:div>
          <html:div id="pp-hub-cat-desc" style="color:var(--fill-secondary,#666);font-size:12px;"></html:div>
        </vbox>
        <html:input type="text" id="pp-hub-filter" placeholder="搜索功能…"
                    style="width:180px;padding:3px 8px;"/>
      </hbox>
      <vbox id="pp-hub-cards" flex="1" style="overflow-y:auto;gap:8px;padding-right:4px;"/>
      <html:div id="pp-hub-status" style="color:var(--fill-tertiary,#888);font-size:12px;min-height:16px;"></html:div>
    </vbox>
  </hbox>
</window>
