<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  body{font:13px/1.5 "Microsoft YaHei",system-ui,sans-serif;margin:0;padding:10px;color:#1f2328;background:#fff;height:100vh;min-width:260px;display:flex;flex-direction:column;overflow:hidden}
  .row{display:flex;gap:6px;margin-bottom:8px;flex-shrink:0}
  input[type=text]{flex:1;min-width:0;padding:7px 9px;border:1px solid #d1d9e0;border-radius:6px;font:inherit;color:#1f2328;background:#fff}
  button{min-height:32px;padding:5px 10px;border:1px solid #d1d9e0;border-radius:6px;background:#f6f8fa;color:#1f2328;cursor:pointer;font:inherit}
  button:focus-visible,input:focus-visible{outline:2px solid #0969da;outline-offset:1px}
  button.primary{background:#0969da;border-color:#0969da;color:#fff}
  #list{flex:1;min-height:0;overflow:auto;border-top:1px solid #eee}
  .item{display:flex;gap:8px;padding:8px 4px;border-bottom:1px solid #f0f0f0;cursor:pointer;overflow-wrap:anywhere}
  .item:hover{background:#f6f8fa}
  .item input{margin-top:4px;flex-shrink:0}
  .item>span{min-width:0}
  .t{font-weight:600}
  .m{color:#59636e;font-size:12px}
  #msg{padding:4px 2px;color:#59636e;min-height:22px;max-height:68px;overflow:auto;flex-shrink:0;overflow-wrap:anywhere}
  .tag{display:inline-block;padding:0 5px;border-radius:4px;background:#eef2f5;color:#59636e;font-size:11px;margin-right:4px}
  .head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-10px -10px 10px;padding:8px 10px;background:#f6f8fa;border-bottom:1px solid #e5e9ee;flex-shrink:0}
  .ttl{font-weight:600}
  .sty{color:#59636e;font-size:11px;flex:1;text-align:right;overflow-wrap:anywhere}
  .x{border:none;background:transparent;font-size:14px;color:#59636e;cursor:pointer;padding:0 4px;min-height:28px}
  .x:hover{color:#d1242f}
  .picker-actions{padding-top:2px}
  .picker-actions .primary{flex:1}
  @media(max-width:340px){.head{gap:4px}.sty{flex-basis:100%;text-align:left}.x{margin-left:auto}}
  @media(max-height:420px){#msg{max-height:44px}.item{padding:5px 4px}.head{margin-bottom:6px}.row{margin-bottom:6px}}
</style>
</head>
<body>
  <div class="head">
    <span class="ttl">插入引文</span>
    <span class="sty" id="style"></span>
    <button class="x" id="close" title="关闭">✕</button>
  </div>
  <div class="row">
    <input type="text" id="q" placeholder="检索标题/作者/年份，回车搜索"/>
    <button class="primary" id="go">搜索</button>
  </div>
  <div class="row picker-actions">
    <button type="button" class="primary" id="ins">插入选中（0）</button>
    <button type="button" id="clr">清空</button>
  </div>
  <div id="msg">在 Zotero 里存好文献后，这里搜关键词即可。</div>
  <div id="list"></div>
  <script src="version.js"></script>
  <script src="js/codes.js"></script>
  <script src="js/styles/util.js"></script>
  <script src="js/styles/gb7714.js"></script>
  <script src="js/styles/apa.js"></script>
  <script src="js/model.js"></script>
  <script src="js/links.js"></script>
    <script src="js/zfields.js"></script>
    <script src="js/integration.js"></script>
  <script src="js/zotero.js"></script>
  <script src="js/doc.js"></script>
  <script src="js/app.js"></script>
  <script src="js/picker.js"></script>
</body>
</html>
